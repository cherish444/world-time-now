compatibility_date = "2026-08-01"

[vars]
GA_MEASUREMENT_ID = "G-P1VMB7BQ3L"   # GA4에서 이 도메인용 새 속성 만들고 측정 ID로 교체하세요

# 한국 공휴일(설날/추석 등 음력 포함) 연동용 키는 여기 평문으로 넣지 말고
# 아래 명령으로 시크릿으로 등록하세요 (터미널에서 실행 후 키 값을 붙여넣기):
#   npx wrangler secret put KASI_API_KEY
# 발급: data.go.kr 가입 → "특일 정보" 검색 → 활용신청 (한국천문연구원 제공, 무료)
# 키가 없어도 사이트는 정상 동작하며, 이 경우 계산 가능한 공휴일만 표시됩니다.
